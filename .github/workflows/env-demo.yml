name: Show Env variables

on:
  workflow_dispatch:
    inputs:
      environments:
        description: Select the environment you want
        required: true
        type: choice
        options:
          - dev
          - stg
          - prod

env:
  NAME: DevOps Engineer

jobs:
  show_env:
    runs-on: ubuntu-latest
    steps:
      - name: Show plain text env
        run: echo "I am a ${{env.NAME}}"
      - name: Show Secrets
        run: echo "One fun secret is ${{secrets.MY_SECRET}}"
      - name: Show DockerHub Username
        run: echo "DockerHub username is ${{vars.DOCKERHUB_USERNAME}}"
